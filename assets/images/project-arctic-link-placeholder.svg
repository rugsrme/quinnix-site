<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a2e"/>
      <stop offset="1" stop-color="#172a4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g)"/>
  <!-- decorative grid lines -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80"  x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>
  <!-- label -->
  <text x="300" y="185" text-anchor="middle"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#4a7cf7">Arctic Link</text>
  <text x="300" y="218" text-anchor="middle"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="13" fill="#3a5a8a">Screenshot placeholder</text>
</svg>
